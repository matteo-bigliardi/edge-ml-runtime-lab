name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Both toolchains report, even when one of them is already red: knowing
      # a failure is MSVC-only is most of the diagnosis.
      fail-fast: false
      # Images are pinned, not -latest: windows-latest moved to Visual Studio
      # 2026 and dropped the 2022 generator the vs preset asks for. Moving to a
      # new toolchain should be a commit here, not something the runner decides.
      matrix:
        include:
          - name: Linux (GCC, Ninja)
            os: ubuntu-24.04
            preset: ninja
          - name: Windows (MSVC)
            os: windows-2022
            preset: vs

    steps:
      - uses: actions/checkout@v7

      - name: Install Ninja
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DTINYTENSOR_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}
